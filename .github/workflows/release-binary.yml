name: Release Alpine binary

on:
  push:
    branches:
      - main
    tags:
      - "upstream-*"
      - "[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-binary-${{ github.ref }}
  cancel-in-progress: false

env:
  TARGET: x86_64-unknown-linux-musl
  FEATURES: sqlite,mysql,postgresql,enable_mimalloc

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/blackdex/rust-musl:x86_64-musl-stable-1.97.1
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build static binary
        shell: bash
        run: |
          rustup set profile minimal
          rustup target add "${TARGET}"
          cargo build --release --features "${FEATURES}" --target "${TARGET}"
          strip "target/${TARGET}/release/vaultwarden"
          file "target/${TARGET}/release/vaultwarden"

      - name: Package binary
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            VERSION="main-${GITHUB_SHA::8}"
          fi
          mkdir -p dist
          cp "target/${TARGET}/release/vaultwarden" "dist/vaultwarden-linux-amd64-musl"
          sha256sum "dist/vaultwarden-linux-amd64-musl" > "dist/vaultwarden-linux-amd64-musl.sha256"
          echo "VERSION=${VERSION}" >> "${GITHUB_ENV}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: vaultwarden-${{ env.VERSION }}-linux-amd64-musl
          path: dist/

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dist/vaultwarden-linux-amd64-musl
            dist/vaultwarden-linux-amd64-musl.sha256
          generate_release_notes: true
