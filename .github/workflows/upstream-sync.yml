name: Sync upstream

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/upstream-sync.yml
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout fork
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Sync upstream main
        id: sync
        run: |
          git remote add upstream https://github.com/dani-garcia/vaultwarden.git
          git fetch upstream main --prune

          UPSTREAM_SHA="$(git rev-parse upstream/main)"
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            echo "Upstream changes already merged."
            exit 0
          fi

          EXISTING_TAG="$(git tag -l "upstream-*-${UPSTREAM_SHA:0:8}" | head -n 1)"
          if [ -n "${EXISTING_TAG}" ]; then
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            echo "Tag already exists for this upstream commit: ${EXISTING_TAG}"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # This fork intentionally deletes all upstream workflow files. Whenever
          # upstream modifies them, git merge hits modify/delete conflicts that
          # recur on every sync — resolve them automatically by keeping our
          # deletion. Conflicts outside .github/workflows/ still fail loudly.
          if ! git merge --no-edit upstream/main; then
            CONFLICTS="$(git diff --name-only --diff-filter=U)"
            echo "Unmerged paths: ${CONFLICTS}"
            if echo "${CONFLICTS}" | grep -qv '^\.github/workflows/'; then
              echo "::error::Merge conflict outside .github/workflows/ — resolve manually on main."
              exit 1
            fi
            echo "${CONFLICTS}" | xargs -r git rm -qf --
          fi

          # The merge can also re-introduce or newly add upstream workflow
          # files; drop everything except the two fork-owned workflows.
          git ls-tree -r --name-only upstream/main -- .github/workflows \
            | grep -Ev '^\.github/workflows/(upstream-sync|release-binary)\.yml$' \
            | xargs -r git rm -qf --ignore-unmatch

          if [ -n "$(git ls-files -u)" ]; then
            echo "::error::Unresolved merge conflicts remain — resolve manually on main."
            git status
            exit 1
          fi

          if git rev-parse -q --verify MERGE_HEAD >/dev/null; then
            git commit --no-edit
          elif ! git diff --cached --quiet; then
            git commit -m "chore(sync): drop upstream workflow files"
          fi

          git push origin HEAD:main

          RELEASE_TAG="upstream-$(date -u +%Y%m%d-%H%M%S)-${UPSTREAM_SHA:0:8}"
          git tag -a "${RELEASE_TAG}" -m "Build upstream ${UPSTREAM_SHA}"
          git push origin "${RELEASE_TAG}"
          GH_TOKEN="${{ github.token }}" gh workflow run release-binary.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref "${RELEASE_TAG}"
          echo "release_tag=${RELEASE_TAG}" >> "${GITHUB_OUTPUT}"
          echo "changed=true" >> "${GITHUB_OUTPUT}"

      - name: Summary
        if: steps.sync.outputs.changed == 'true'
        run: echo "Fork synchronized with upstream; the release workflow will build the new binary."

      - name: Notify on failure
        if: failure()
        run: echo "::error::Upstream synchronization failed. Check the job logs and resolve the issue manually."
