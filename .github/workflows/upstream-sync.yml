name: Sync upstream

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Sync upstream main
        id: sync
        run: |
          git remote add upstream https://github.com/dani-garcia/vaultwarden.git
          git fetch upstream main --tags

          LOCAL_SHA="$(git rev-parse HEAD)"
          UPSTREAM_SHA="$(git rev-parse upstream/main)"
          if [ "${LOCAL_SHA}" = "${UPSTREAM_SHA}" ]; then
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-edit upstream/main
          git push origin HEAD:main

          RELEASE_TAG="upstream-$(date -u +%Y%m%d-%H%M%S)-${UPSTREAM_SHA:0:8}"
          git tag -a "${RELEASE_TAG}" -m "Build upstream ${UPSTREAM_SHA}"
          git push origin "${RELEASE_TAG}"
          GH_TOKEN="${{ github.token }}" gh workflow run release-binary.yml --ref "${RELEASE_TAG}"
          echo "release_tag=${RELEASE_TAG}" >> "${GITHUB_OUTPUT}"
          echo "changed=true" >> "${GITHUB_OUTPUT}"

      - name: Summary
        if: steps.sync.outputs.changed == 'true'
        run: echo "Fork synchronized with upstream; the release workflow will build the new binary."
